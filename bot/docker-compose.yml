services:
  bot:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      OCR_SERVICE_URL: http://ocr:8000
      REVIEW_SERVICE_URL: http://host.docker.internal:8002
    depends_on:
      postgres:
        condition: service_healthy
      ocr:
        condition: service_healthy
    networks:
      - samudera

  ocr:
    build: ./ocr-service
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - got_models:/root/.cache/huggingface  # cache downloaded GOT-OCR model
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s   # first start downloads models, takes longer
    networks:
      - samudera

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: fishstorage_db
      POSTGRES_USER: ${DB_USER:-samudera}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-samudera} -d fishstorage_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - samudera

volumes:
  pgdata:
  got_models:

networks:
  samudera:
    driver: bridge
